name: Weekly Durham Market Comps Agent

on:
  schedule:
    # Runs every Monday at 9:00 AM EST (14:00 UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market-comps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 rich tabulate playwright

      - name: Run Durham Market Comps Research
        run: |
          python agent.py comps > reports/latest_durham_comps.txt
          python agent.py package

      - name: Upload Comps & Listing Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: durham-market-comps-and-dossiers
          path: reports/

      - name: Commit Updated Reports (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Durham rental market comps [skip ci]" && git push)
