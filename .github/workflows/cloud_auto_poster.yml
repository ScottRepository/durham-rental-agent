name: Cloud Auto-Poster & Listing Bot

on:
  workflow_dispatch:
    inputs:
      unit_id:
        description: 'Unit to Post (e.g. unit_3, unit_1, or all)'
        required: true
        default: 'unit_3'
        type: choice
        options:
          - unit_3
          - unit_1
          - unit_2
          - unit_4
          - unit_5
          - unit_6
          - all
      platform:
        description: 'Listing Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - facebook
          - kijiji
          - zumper
          - rentals_ca
          - liv_rent
      auto_publish:
        description: 'Auto-Submit (Click Publish on Platform)'
        required: false
        default: false
        type: boolean
  schedule:
    # 7-Day Auto-Refresh Cron: Runs every Sunday at 08:00 EST (13:00 UTC)
    - cron: '0 13 * * 0'

permissions:
  contents: write

jobs:
  cloud_post:
    name: Run Cloud Posting Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore Authenticated Browser Session (if configured in Secrets)
        env:
          PROFILE_BUNDLE: ${{ secrets.BROWSER_PROFILE_B64 }}
        run: |
          if [ -n "$PROFILE_BUNDLE" ]; then
            mkdir -p ~/.property_agent_browser_profile
            echo "$PROFILE_BUNDLE" | base64 -d | tar -xz -C ~/.property_agent_browser_profile
            echo "✔ Restored authenticated browser session from GitHub Secrets."
          else
            echo "ℹ No session secret found. Running fresh browser session."
          fi

      - name: Run Auto-Posting Bot
        env:
          HEADLESS: "true"
        run: |
          AUTO_PUB_FLAG=""
          if [ "${{ github.event.inputs.auto_publish }}" = "true" ]; then
            AUTO_PUB_FLAG="--auto-publish"
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Running scheduled 7-day auto-refresh check..."
            python agent.py refresh
          elif [ "${{ github.event.inputs.unit_id }}" = "all" ]; then
            for u in unit_1 unit_2 unit_3 unit_4 unit_5 unit_6; do
              if [ "${{ github.event.inputs.platform }}" = "all" ]; then
                for p in facebook kijiji zumper rentals_ca liv_rent; do
                  python agent.py post --unit $u --platform $p --headless $AUTO_PUB_FLAG || true
                done
              else
                python agent.py post --unit $u --platform ${{ github.event.inputs.platform }} --headless $AUTO_PUB_FLAG || true
              fi
            done
          else
            if [ "${{ github.event.inputs.platform }}" = "all" ]; then
              for p in facebook kijiji zumper rentals_ca liv_rent; do
                python agent.py post --unit ${{ github.event.inputs.unit_id }} --platform $p --headless $AUTO_PUB_FLAG || true
              done
            else
              python agent.py post --unit ${{ github.event.inputs.unit_id }} --platform ${{ github.event.inputs.platform }} --headless $AUTO_PUB_FLAG || true
            fi
          fi

      - name: Upload Bot Screenshots & Staging Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-bot-screenshots
          path: reports/screenshots/
          if-no-files-found: ignore
